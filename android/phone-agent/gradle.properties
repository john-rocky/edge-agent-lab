org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# In-process Kotlin compilation: the daemon writes under ~/Library, which sandboxed builds cannot.
kotlin.compiler.execution.strategy=in-process
# LiteRT-LM runtime pin. 0.17.0 ships Kotlin 2.4 metadata that AGP 9.3.1's Kotlin refuses without -Xskip-metadata-version-check.
litertlmVersion=0.16.1
coroutinesVersion=1.11.0
